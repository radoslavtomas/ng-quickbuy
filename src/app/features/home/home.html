<section
  aria-labelledby="home-title"
  class="home px-4 py-8 sm:py-10"
  [style.--brand-primary]="brand.primaryColor"
  [style.--brand-secondary]="brand.secondaryColor"
>
  <div class="mx-auto flex w-full max-w-4xl flex-col gap-8">
    <header class="rounded-xl border border-slate-200/70 bg-white/90 p-6 shadow-sm sm:p-8">
      <p class="text-sm font-semibold uppercase tracking-[0.12em] text-[var(--brand-primary)]">
        Welcome
      </p>
      <h1 id="home-title" class="mt-2 text-3xl font-bold text-slate-900 sm:text-4xl">
        Choose a {{ brand.fullName }} product
      </h1>
      <p class="mt-3 max-w-2xl text-base leading-7 text-slate-600">
        Select one of the modules below to continue your quote journey.
      </p>
    </header>

    <ul
      class="grid list-none gap-4 p-0 sm:grid-cols-2 lg:grid-cols-3"
      role="list"
      aria-label="Available modules"
    >
      @for (module of brand.modules; track module.code) {
        <li class="min-w-0">
          <a
            [routerLink]="['/', module.code]"
            class="module-card group block h-full rounded-xl border border-slate-200 bg-white p-5 text-left no-underline shadow-sm transition duration-150 ease-out hover:-translate-y-0.5 hover:shadow-md focus-visible:-translate-y-0.5 focus-visible:shadow-md focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-[var(--brand-primary)]"
            [attr.aria-label]="'Open ' + module.description"
          >
            <div
              class="inline-flex h-10 w-10 items-center justify-center rounded-full text-white"
              [style.background-color]="brand.primaryColor"
            >
              <i class="fa-solid {{ module.icon }}" aria-hidden="true"></i>
            </div>
            <h2 class="mt-4 text-xl font-semibold text-slate-900">{{ module.description }}</h2>
            <p class="mt-2 text-sm leading-6 text-slate-600">
              Continue to {{ module.description.toLowerCase() }} details.
            </p>
          </a>
        </li>
      }
    </ul>
  </div>
</section>
