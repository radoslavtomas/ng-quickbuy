<header class="w-full">
  <!-- Top bar: logo + contact info -->
  <div
    class="mx-auto max-w-4xl flex items-center justify-between bg-white px-4 py-3 sm:px-6 sm:py-4"
  >
    <a href="/" class="inline-flex shrink-0" [attr.aria-label]="brand.fullName + ' home'">
      <img
        [ngSrc]="brand.logoPath"
        [alt]="brand.fullName + ' logo'"
        width="200"
        height="60"
        priority
        class="h-10 w-auto object-contain sm:h-[60px]"
      />
    </a>

    <div class="flex flex-col items-end gap-1">
      <span class="flex items-center gap-1.5 text-sm font-semibold text-gray-800 sm:text-base">
        {{ headerTitle() }}
        @if (headerIcon()) {
          <i class="fa-solid {{ headerIcon() }}" aria-hidden="true"></i>
        }
      </span>
      <a
        [href]="headerPhoneLink()"
        class="flex items-center gap-1.5 text-sm font-semibold text-blue-500 hover:underline focus-visible:underline focus-visible:outline-offset-2 sm:text-base"
        [attr.aria-label]="'Call us on ' + headerPhone()"
      >
        <i class="fa-solid fa-phone" aria-hidden="true"></i>
        {{ headerPhone() }}
      </a>
    </div>
  </div>

  <!-- Coloured title bar -->
  <div
    class="flex items-center justify-center px-4 py-2.5"
    [style.background-color]="brand.primaryColor"
    role="banner"
    aria-label="Section header"
  >
    <span class="text-sm font-bold tracking-wide text-white sm:text-lg">{{ headerTitle() }}</span>
  </div>
</header>
