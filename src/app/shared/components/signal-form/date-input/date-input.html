<div
  #group
  class="flex h-11 w-full items-center overflow-hidden rounded-md border bg-white px-2.5 focus-within:outline-2 focus-within:outline-offset-1 focus-within:outline-sky-500"
  [class.border-slate-400]="!showInvalid() && !showValid()"
  [class.border-red-500]="showInvalid()"
  [class.bg-red-50]="showInvalid()"
  [class.border-green-500]="showValid()"
  [class.bg-green-50]="showValid()"
  (focusout)="onGroupFocusOut($event)"
>
  <input
    #dayInput
    [id]="controlId()"
    type="text"
    inputmode="numeric"
    autocomplete="bday-day"
    placeholder="DD"
    maxlength="2"
    [attr.aria-label]="label() + ' day'"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-invalid]="showInvalid()"
    [disabled]="disabled()"
    [value]="day()"
    (input)="onDayInput($event)"
    (blur)="onDayBlur()"
    class="h-full min-w-0 flex-1 border-0 bg-transparent text-center text-[0.95rem] placeholder:italic placeholder:text-slate-400 focus:outline-none"
  />

  <span class="shrink-0 px-1 text-slate-400" aria-hidden="true">/</span>

  <input
    #monthInput
    [id]="controlId() + '-month'"
    type="text"
    inputmode="numeric"
    autocomplete="bday-month"
    placeholder="MM"
    maxlength="2"
    [attr.aria-label]="label() + ' month'"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-invalid]="showInvalid()"
    [disabled]="disabled()"
    [value]="month()"
    (input)="onMonthInput($event)"
    (blur)="onMonthBlur()"
    class="h-full min-w-0 flex-1 border-0 bg-transparent text-center text-[0.95rem] placeholder:italic placeholder:text-slate-400 focus:outline-none"
  />

  <span class="shrink-0 px-1 text-slate-400" aria-hidden="true">/</span>

  <input
    #yearInput
    [id]="controlId() + '-year'"
    type="text"
    inputmode="numeric"
    autocomplete="bday-year"
    placeholder="YYYY"
    maxlength="4"
    [attr.aria-label]="label() + ' year'"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-invalid]="showInvalid()"
    [disabled]="disabled()"
    [value]="year()"
    (input)="onYearInput($event)"
    class="h-full min-w-0 flex-1 border-0 bg-transparent text-center text-[0.95rem] placeholder:italic placeholder:text-slate-400 focus:outline-none"
  />
</div>
