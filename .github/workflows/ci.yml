name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

# FOLLOW-UP: `npm run format:check` is deliberately not run here yet. The existing
# tree is not Prettier-compliant, and reformatting it would collide with in-flight
# work. Add the step once the repo has been formatted once in a dedicated commit.
